name: Component or API proposal
description: Discuss a new component or public API before implementation.
title: "proposal: "
labels: [proposal]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What application behavior cannot be expressed cleanly today?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed contract
      description: Include ownership, sizing, focus, messages, and alternatives.
    validations:
      required: true
  - type: textarea
    id: cross-application-evidence
    attributes:
      label: Cross-application evidence
      description: Which two or more independent applications need this behavior, and why can existing packages not express it cleanly?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests
      description: Describe the behavior, snapshot, scenario, or compatibility test that would demonstrate the proposal is complete.
    validations:
      required: true

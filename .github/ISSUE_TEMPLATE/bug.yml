name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal program, messages, and terminal dimensions.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tuiweave and Go versions
    validations:
      required: true
